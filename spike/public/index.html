<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike Test</title>
    <style>
        /* Placeholder from tutorial */
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
</head>
<body>
    <h1>Spike</h1>
    <form id="usernameForm" action = "">
        <input id="usernameInput" autocomplete="off"><button>Submit Name</button>
    </form>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    <button onclick="buzzIn()" class="buzzer">Buzzer</button>
    <button onclick="resetBuzzer()" class="buzzer">Reset Buzzer</button>


    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const nameForm = document.querySelector('#usernameForm');
        const nameInput = document.querySelector('#usernameInput');
        const chatForm = document.querySelector('#form');
        const chatInput = document.querySelector('#input');
        const messages = document.querySelector('#messages');
        
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (chatInput.value) {
                socket.emit('chat message', chatInput.value)
                chatInput.value = '';
            }
        });

        nameForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (nameInput.value) {
                socket.emit('username value', nameInput.value);
            }
        });

        socket.on('chat message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight)
        })

        const buzzIn = () => {
            socket.emit('buzzer')
        }
        
        const resetBuzzer = () => {
            socket.emit('reset buzzer')
        }
    </script>
</body>
</html>
