<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { 
            margin: 0; 
            padding-bottom: 3rem; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center; 
        }

        #signInCard {

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around; 
            background-color: aqua;
            height: 30rem;
            width: 22.5rem;
            border: solid blue 2px;
            border-radius: 8px;
        }

            #signInCard > form {
                display: flex;
                flex-direction: column;
                gap: 1rem; 
            }

        #roomCode {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 3rem;
            width: 4ch;
            box-sizing: content-box;
            padding: 0.5rem;
            text-align: center;
            text-transform: uppercase;
            border: solid blue 2px;
            border-radius: 8px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="signInCard">
        <h2>Enter Room Number</h2>
        <form>
            <input type="text" id="roomCode" maxlength="4"
                autocapitalize="characters"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false">
            <button onclick="enterRoom()">Enter Room</button>
        </form>
    </div>
    <script>
        const enterRoom = (e) => {
            e.preventDefault();
            console.log(e.log)
        };

    </script>
</body>
</html>
