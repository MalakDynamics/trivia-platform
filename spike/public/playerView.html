<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { 
            margin: 0; 
            padding-bottom: 3rem; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center; 
        }

        #signInCard {

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around; 
            height: 30rem;
            width: 22.5rem;
            border: solid blue 2px;
            border-radius: 8px;
        }

            #signInCard > form {
                display: flex;
                flex-direction: column;
                gap: 1rem; 
            }

        #roomCode {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 3rem;
            width: 4ch;
            box-sizing: content-box;
            padding: 0.5rem;
            text-align: center;
            text-transform: uppercase;
            border: solid blue 2px;
            border-radius: 8px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="signInCard">
        <h2>Enter Room Number</h2>
        <form id="roomForm">
            <input type="text" id="roomCode" maxlength="4"
                autocapitalize="characters"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false">
            <button id="roomButton">Enter Room</button>
            <p style="margin: 0;" id="signInStatus">.</p>
        </form>
    </div>
    <div class="chatRoom">
        <ul id="messages"></ul>
        <form id="chatForm">
            <input type="text" id="chatInput">
            <button id="chatSubmit">Submit</button>
        </form>


    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const signInForm = document.querySelector('#roomForm');
        const signInInput = document.querySelector('#roomCode');
        const signInButton = document.querySelector('#roomButton');

        const messages = document.querySelector('#messages');
        const chatForm = document.querySelector('#chatForm');
        const chatInput = document.querySelector('#chatInput');
        const chatButton = document.querySelector('#chatSubmit');

        const status = document.querySelector('#signInStatus');

        signInForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (signInInput.value.length === 4) {
                const roomCode = signInInput.value.toUpperCase()
                socket.emit('room:join', roomCode)
            }
        });
        socket.on('room:joined', ([result, roomCode]) => {
            if (result) {
                status.textContent = `Joined room`;
                status.style.color = 'green';
                return;
            } status.textContent = `Not Found`;
            status.style.color = 'red';
        })

        
        
        
        // We got chat functionality!
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if(chatInput.value.length > 0) {
                socket.emit('room:message', chatInput.value);
                chatInput.value = '';
            }
        })
        socket.on('room:message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
        })
        

    </script>
</body>
</html>
